<body style="font-family: 'Inter', sans-serif !important;">
  
  <nav class="navbar">
    <a href="../user/userHome.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare
    </a>
    
    <div class="nav-search">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" id="globalSearchInput" placeholder="Tìm kiếm tài liệu, môn học, giáo trình...">
    </div>

    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="content-area">
      <nav aria-label="breadcrumb" class="breadcrumb-container">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../user/userHome.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page">Khám phá bài thi</li>
        </ol>
      </nav>
      <div class="page-header-container">
        <h1 class="page-title"><i class="fa-solid fa-gamepad"></i> Khám phá bài thi trắc nghiệm</h1>
        <p class="page-subtitle">Tìm kiếm và làm các bài thi trắc nghiệm từ nhiều môn học khác nhau để củng cố kiến thức.</p>
      </div>

      <div class="search-filter-container">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="quizSearchInput" placeholder="Nhập tên bài thi cần tìm...">
        </div>
        <div class="filter-box">
          <select id="subjectFilter">
            <option value="">Tất cả môn học</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnSearch">Lọc kết quả</button>
      </div>

      <div class="quiz-grid" id="quizGrid">
        <!-- Quizzes will be rendered here -->
        <div class="skeleton-quiz-card" style="height: 200px; border-radius: var(--radius); background: #f3f4f6; animation: pulse 1.5s infinite;"></div>
        <div class="skeleton-quiz-card" style="height: 200px; border-radius: var(--radius); background: #f3f4f6; animation: pulse 1.5s infinite;"></div>
        <div class="skeleton-quiz-card" style="height: 200px; border-radius: var(--radius); background: #f3f4f6; animation: pulse 1.5s infinite;"></div>
      </div>

      <div class="pagination" id="pagination">
        <!-- Pagination will be rendered here -->
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script type="module" src="../../main/quiz/quizList.js"></script>
</body>
</html>
