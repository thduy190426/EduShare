    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm bài thi — EduShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/shared/sidebar.css">
    <link rel="stylesheet" href="../../css/shared/footer.css">
    <link rel="stylesheet" href="../../css/quiz/takeQuiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../../css/shared/sidebar.css">
    <script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script>
    <link rel="stylesheet" href="../../css/shared/breadcrumb.css">
</head>
<body style="font-family: 'Inter', sans-serif !important;">
    <nav class="navbar">
        <a href="../user/userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
        <div class="nav-actions">
            <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
                <i class="fa-solid fa-bell"></i>
                <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
            </button>
            <div class="user-profile" id="userProfileNav">
                <div class="avatar" id="navAvatar">?</div>
                <div class="user-info">
                    <span class="user-name" id="navUserName">Đang tải...</span>
                    <span class="user-role" id="navUserRole"></span>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-layout">
        <aside id="app-sidebar" class="sidebar"></aside>
        <main class="content-area">
            <nav aria-label="breadcrumb" class="breadcrumb-container">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="../user/userHome.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                    <li class="breadcrumb-item"><a href="quizList.html">Khám phá bài thi</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Làm bài thi</li>
                </ol>
            </nav>
        <div class="main-container">

        <div id="startScreen" class="card start-screen">
            <h1 id="startQuizTitle">Đang tải Đề thi...</h1>
            <p id="startQuizDesc" class="text-muted"></p>
            <div class="quiz-info-grid">
                <div class="info-item">
                    <div class="info-icon-wrapper">
                        <i class="fa-solid fa-list-ol"></i>
                    </div>
                    <div>
                        <strong>Số câu hỏi</strong>
                        <p id="startQuizQuestions">--</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon-wrapper">
                        <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <div>
                        <strong>Thời gian</strong>
                        <p id="startQuizTime">-- phút</p>
                    </div>
                </div>
            </div>
            <button class="btn btn-primary btn-large" id="btnStartQuiz" disabled>Bắt đầu làm bài</button>
        </div>

        <div id="quizContainer" style="display: none;">
            <div class="quiz-layout">

                <div class="questions-area">
                    <div class="quiz-header card" style="margin-bottom: 2rem; border-left: 5px solid var(--primary); padding-left: 1.5rem;">
                        <h2 id="runningQuizTitle" style="margin-bottom: 0.5rem; color: var(--primary);">Đang tải Đề thi...</h2>
                        <p id="runningQuizDesc" class="text-muted" style="margin-bottom: 0;"></p>
                    </div>
                    <form id="quizForm">
                        <div id="questionsList">

                        </div>
                        <button type="button" class="btn btn-primary btn-submit" id="btnSubmitQuiz"><i class="fa-solid fa-paper-plane"></i> Nộp bài</button>
                    </form>
                </div>

                <div class="side-panel sticky-nav">
                    <div class="card timer-card" id="timerContainer" style="display: none;">
                        <span class="timer-label"><i class="fa-solid fa-stopwatch"></i> Thời gian còn lại:</span>
                        <span id="countdown" class="timer-value">00:00</span>
                    </div>
                    <div class="card">
                        <h3>Danh sách câu hỏi</h3>
                        <div class="question-nav-grid" id="questionNav">

                        </div>
                        <div class="nav-legend">
                            <span class="legend-item"><span class="box answered"></span> Đã trả lời</span>
                            <span class="legend-item"><span class="box unanswered"></span> Chưa trả lời</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultScreen" class="card result-screen" style="display: none;">
            <div class="result-header">
                <i class="fa-solid fa-circle-check success-icon"></i>
                <h2>Nộp bài thành công!</h2>
            </div>
            <div class="result-score">
                <div class="score-circle">
                    <span id="resultScore">0</span>
                    <small>/100</small>
                </div>
            </div>
            <div class="result-details">
                <p>Số câu đúng: <strong id="resultCorrect">0</strong> / <span id="resultTotal">0</span></p>
            </div>
            <div id="feedbackList" class="feedback-list">

            </div>
            <div class="result-actions" style="display: flex; gap: 24px; justify-content: center; margin-top: 20px;">
                <button type="button" id="btnReviewQuiz" class="btn btn-secondary"><i class="fa-solid fa-eye"></i> Xem lại bài làm</button>
                <a href="../user/userHome.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Trở về Trang Chủ</a>
            </div>
        </div>
    </div>

    
    <script type="module" src="../../main/quiz/takeQuiz.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script type="module" src="../../main/shared/sidebar.js"></script>
</div>
        </main></div>
</body>
</html>
