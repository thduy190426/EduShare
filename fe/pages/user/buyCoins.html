<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nạp EduCoin — EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%232563eb' d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
  <link rel="stylesheet" href="../../css/user/userProfile.css">
  <style>

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes scaleDown { from { transform: scale(1); opacity: 1; } to { transform: scale(0.95); opacity: 0; } }
    
    .modal-overlay.show { display: flex !important; animation: fadeIn 0.2s ease-out forwards; }
    .modal-overlay.hide { display: flex !important; animation: fadeOut 0.2s ease-in forwards; }
    .modal-overlay.show .modal-content { animation: scaleUp 0.2s ease-out forwards; }
    .modal-overlay.hide .modal-content { animation: scaleDown 0.2s ease-in forwards; }

    .packages-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 24px;
        margin-top: 24px;
    }
    .package-card {
        background: white;
        border: 2px solid #E5E7EB;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }
    .package-card:hover {
        border-color: #3b82f6;
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1), 0 4px 6px -2px rgba(59, 130, 246, 0.05);
        transform: translateY(-4px);
    }
    .package-icon {
        font-size: 48px;
        color: #f59e0b;
        margin-bottom: 16px;
    }
    .package-coins {
        font-size: 24px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 8px;
    }
    .package-price {
        font-size: 18px;
        color: #4b5563;
        margin-bottom: 24px;
        font-weight: 500;
    }
    .btn-buy {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
    }
    .package-card:hover .btn-buy {
        background: #2563eb;
    }
    .loading-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: 10px;
        display: none;
    }
    .package-card.loading .loading-overlay {
        display: flex;
    }
    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>if (localStorage.getItem('sidebar-collapsed') === 'true') { document.documentElement.classList.add('sidebar-collapsed'); }</script>
</head>

<body>
  <nav class="navbar">
    <a href="userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <main class="content-area">
      <div class="profile-header" style="margin-bottom: 20px;">
        <h1 class="page-title"><i class="fa-solid fa-coins" style="color: #f59e0b; margin-right: 16px;"></i>Nạp EduCoin</h1>
        <p style="color: #64748B; margin-top: 8px;">Nạp xu để có thể mua và tải xuống các tài liệu độc quyền chất lượng cao.</p>
      </div>

      <div class="packages-container" id="packages-container">

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <div id="qrModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="position: relative; background: white; padding: 40px; border-radius: 12px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
      <button id="btn-close-mark" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 20px; color: #64748b; cursor: pointer; transition: color 0.2s;"><i class="fa-solid fa-xmark"></i></button>
      
      <h3 style="font-size: 24px; font-weight: 700; color: #1f2937; margin-bottom: 16px;">Thanh toán qua mã QR</h3>
      <p style="font-size: 15px; color: #64748b; margin-bottom: 24px;">Vui lòng mở ứng dụng ngân hàng và quét mã dưới đây để thanh toán.</p>
      
      <div style="background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 24px; display: inline-block;">
        <img id="qrCodeImage" src="" alt="Mã QR Thanh Toán" style="width: 300px; height: 300px; object-fit: contain; background: white; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
      </div>

      <div style="text-align: left; background: #f1f5f9; padding: 20px; border-radius: 8px; margin-bottom: 24px;">
        <div style="margin-bottom: 12px;"><span style="color: #64748b; font-size: 14px;">Số tiền:</span> <strong id="qrAmount" style="color: #ef4444; float: right; font-size: 16px;"></strong></div>
        <div style="margin-bottom: 12px;"><span style="color: #64748b; font-size: 14px;">Nội dung:</span> <strong id="qrAddInfo" style="color: #1f2937; float: right; font-size: 16px;"></strong></div>
        <div style="font-size: 13px; color: #ef4444; margin-top: 16px; font-weight: 500; text-align: center;"><i class="fa-solid fa-triangle-exclamation"></i> Vui lòng nhập ĐÚNG NỘI DUNG CHUYỂN KHOẢN để được tự động duyệt (hoặc duyệt tay).</div>
      </div>

      <button id="btn-close-qr" style="background: #3b82f6; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;"><i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Tôi đã thanh toán thành công</button>
    </div>
  </div>

  <script type="module" src="../../main/shared/sidebar.js"></script>
  <script type="module" src="../../main/user/buyCoins.js"></script>
</body>
</html>
