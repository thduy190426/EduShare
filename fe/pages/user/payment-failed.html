<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán thất bại — EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%232563eb' d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
  <link rel="stylesheet" href="../../css/user/userProfile.css">
  <link rel="stylesheet" href="../../css/user/paymentResult.css">
  <script>if (localStorage.getItem('sidebar-collapsed') === 'true') { document.documentElement.classList.add('sidebar-collapsed'); }</script>
</head>

<body>
  <nav class="navbar">
    <a href="userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    
    <main class="content-area">
      <div class="payment-result-container">
        <div class="result-icon failed-icon">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
        <h1 class="result-title">Thanh toán thất bại</h1>
        <p class="result-desc">Giao dịch của bạn đã bị hủy hoặc xảy ra lỗi trong quá trình xử lý. Tài khoản của bạn chưa bị trừ tiền.</p>
        
        <div class="transaction-details">
          <div class="detail-row">
            <span class="detail-label">Mã giao dịch</span>
            <span class="detail-value" id="txOrderInfo">Đang tải...</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Thời gian</span>
            <span class="detail-value" id="txDate">Đang tải...</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Lý do lỗi</span>
            <span class="detail-value" style="color: #EF4444;">Khách hàng hủy giao dịch / Lỗi thẻ</span>
          </div>
        </div>

        <div class="action-buttons">
          <a href="buyCoins.html" class="btn-outline">
            <i class="fa-solid fa-arrow-rotate-left"></i> Thử lại
          </a>
          <a href="../../pages/guest/contact.html" class="btn-primary">
            <i class="fa-solid fa-headset"></i> Liên hệ hỗ trợ
          </a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../../main/shared/sidebar.js"></script>
  <script type="module" src="../../main/user/paymentResult.js"></script>
</body>
</html>
