  <link rel="stylesheet" href="../../css/shared/sidebar.css">
  <link rel="stylesheet" href="../../css/user/transactionHistory.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <nav class="navbar">
    <a href="userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>

      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">U</div>
        <div class="user-info hide-on-tablet-mobile">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    
    <main class="content-area">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 class="page-title">Lịch sử giao dịch</h1>
          <p class="page-desc" style="margin-bottom: 0;">Theo dõi toàn bộ biến động số dư EduCoin (Xu) của bạn.</p>
        </div>
        <div class="export-actions" style="display: flex; gap: 10px;">
          <button id="btn-export-excel" class="btn-export"><i class="fa-solid fa-file-excel" style="color: #10B981;"></i> Xuất Excel</button>
          <button id="btn-export-pdf" class="btn-export"><i class="fa-solid fa-file-pdf" style="color: #EF4444;"></i> Xuất PDF</button>
        </div>
      </div>

      <div class="card" id="transaction-card">
        <table class="transaction-table">
          <thead>
            <tr>
              <th><i class="fa-regular fa-clock" style="margin-right: 6px;"></i> Thời gian</th>
              <th><i class="fa-solid fa-tags" style="margin-right: 6px;"></i> Loại giao dịch</th>
              <th><i class="fa-solid fa-coins" style="margin-right: 6px;"></i> Số dư thay đổi</th>
              <th><i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i> Mô tả chi tiết</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <tr>
              <td colspan="4" class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Đang tải dữ liệu...</p>
              </td>
            </tr>
          </tbody>
        </table>
        
        <div id="pagination-container"></div>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
  <script type="module" src="../../main/user/transactionHistory.js"></script>
</body>
</html>
