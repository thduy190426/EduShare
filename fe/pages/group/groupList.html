<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách nhóm học tập — EduShare</title>

  <link rel="stylesheet" href="../../css/shared/skeleton.css">

<script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script></head>
<body>
  
  <nav class="navbar">
    <a href="../user/userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <!-- <div class="nav-search">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" placeholder="Tìm kiếm nhóm, môn học...">
    </div> -->
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
                  <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Nhóm học tập</h1>
        <button class="btn-primary" id="btn-create-group">
          <span><i class="fa-solid fa-plus"></i></span> Tạo nhóm mới
        </button>
      </div>

      <div class="tabs-container">
        <div class="tab-item active" id="tab-all-groups"><i class="fa-solid fa-compass"></i> Khám phá nhóm</div>
        <div class="tab-item" id="tab-my-groups"><i class="fa-solid fa-users"></i> Nhóm của tôi</div>
      </div>

      <div class="filter-bar">
        <div class="filter-controls">
          <select class="filter-select" id="filter-member-count">
            <option value="">Thành viên: Tất cả</option>
            <option value="<10">Dưới 10 thành viên</option>
            <option value="10-50">10 - 50 thành viên</option>
            <option value=">50">Trên 50 thành viên</option>
          </select>

          <div class="custom-multiselect" id="subject-multiselect">
            <div class="multiselect-header">
              <span id="multiselect-label">Tất cả môn học</span>
              <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="multiselect-dropdown" id="subject-dropdown">

            </div>
          </div>

          <select class="filter-select" id="filter-privacy">
            <option value="">Loại nhóm: Tất cả</option>
            <option value="public">Công khai</option>
            <option value="private">Riêng tư</option>
          </select>
        </div>
        
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-group" class="form-control" placeholder="Tìm nhóm học tập theo tên..">
        </div>
      </div>

      <div id="recommended-section" style="display: none; margin-bottom: 32px;">
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary);">Nhóm gợi ý cho bạn</h2>
        <div class="group-grid" id="recommended-group-grid">
        </div>
      </div>

      <h2 id="main-group-title" style="font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary);">Tất cả các nhóm</h2>
      <div class="group-grid" id="group-grid">
        
      </div>

      <div id="infiniteScrollSentinel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; min-height: 80px; width: 100%;">
        <div id="scrollSpinner" style="display: none; align-items: center; gap: 8px; color: var(--primary); font-weight: 500;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i>
          <span>Đang tải thêm...</span>
        </div>
        <div id="scrollEndMessage" style="display: none; color: var(--text-secondary, #64748b); font-size: 14px; text-align: center;">
          <i class="fa-solid fa-circle-check" style="margin-right: 6px; color: #10b981;"></i>Đã hiển thị tất cả nhóm học tập
        </div>
      </div>

      <div id="createGroupModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">Tạo nhóm học tập mới</h2>
            <span class="close-modal" id="btn-close-create-group" style="cursor:pointer; font-size: 24px;">&times;</span>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-users" style="margin-right:4px;"></i> Tên nhóm <span style="color:red">*</span></label>
            <input type="text" id="new-group-name" class="form-control" placeholder="Nhập tên nhóm...">
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-book" style="margin-right:4px;"></i> Môn học</label>
            <select id="new-group-subject" class="form-control">
              <option value="">Chọn môn học</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-align-left" style="margin-right:4px;"></i> Mô tả (tùy chọn)</label>
            <textarea id="new-group-desc" class="form-control" rows="3" placeholder="Nhập mô tả về nhóm..."></textarea>
          </div>
          <div class="modal-footer">
            <button id="btn-cancel-create-group" class="btn-outline-primary" style="padding: 8px 16px; flex: none;"><i class="fa-solid fa-xmark" style="margin-right:4px;"></i> Hủy</button>
            <button id="btn-confirm-create-group" class="btn-primary" style="padding: 8px 16px; opacity: 0.6; pointer-events: none;" disabled><i class="fa-solid fa-check" style="margin-right:4px;"></i> Tạo nhóm</button>
          </div>
        </div>
      </div>

      <div id="editGroupModal" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">Sửa nhóm học tập</h2>
            <span class="close-modal" id="btn-close-edit-group" style="cursor:pointer; font-size: 24px;">&times;</span>
          </div>
          <input type="hidden" id="edit-group-id">
          <div class="form-group">
            <label class="form-label">Tên nhóm <span style="color:red">*</span></label>
            <input type="text" id="edit-group-name" class="form-control" placeholder="Nhập tên nhóm...">
          </div>
          <div class="form-group">
            <label class="form-label">Môn học</label>
            <select id="edit-group-subject" class="form-control">
              <option value="">Chọn môn học</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Mô tả (tùy chọn)</label>
            <textarea id="edit-group-desc" class="form-control" rows="3" placeholder="Nhập mô tả về nhóm..."></textarea>
          </div>
          <div class="modal-footer">
            <button id="btn-cancel-edit-group" class="btn-outline-primary" style="padding: 8px 16px; flex: none;">Hủy</button>
            <button id="btn-confirm-edit-group" class="btn-primary" style="padding: 8px 16px;">Cập nhật</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="../../main/group/groups.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
