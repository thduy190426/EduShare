<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực Email — EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/auth/login.css">
  <link rel="stylesheet" href="../../css/auth/forgot-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%232563eb' d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-container">
    <div class="auth-left">
      <a href="../guest/guestHome.html" class="auth-brand">
        <i class="fa-solid fa-book"></i> EduShare
      </a>
      <div class="auth-illustration">
        <h1>Hoàn tất đăng ký</h1>
        <p>Gia nhập cộng đồng học tập trực tuyến lớn nhất Việt Nam. Vui lòng xác thực email của bạn để tiếp tục.</p>
      </div>
      <div style="position: relative; z-index: 10; font-size: 14px; color: rgba(255,255,255,0.7);">
        &copy; 2026 EduShare. All rights reserved.
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrapper">
        <a href="register.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại trang đăng ký</a>

        <div id="step-otp" class="step-container active">
          <div class="auth-header">
            <h2>Xác thực Email</h2>
            <p>Nhập mã OTP gồm 6 chữ số vừa được gửi đến email <strong id="displayEmail"></strong></p>
          </div>
          <form id="verifyRegisterOtpForm">
            <div class="form-group">
              <label class="form-label">Mã OTP:</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa-solid fa-shield-halved"></i></span>
                <input type="text" id="otpCode" class="form-control" placeholder="Nhập mã OTP 6 số" pattern="[0-9]{6}" maxlength="6" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btnVerifyOTP">Xác nhận Đăng ký</button>
            <div class="auth-footer" style="margin-top: 16px;">
              Chưa nhận được mã? <a href="#" id="resendOtp">Gửi lại</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/auth/register-verify.js"></script>
</body>
</html>
