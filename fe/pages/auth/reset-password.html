<body style="font-family: 'Inter', sans-serif !important;">
  <div class="auth-container">
    
    <div class="auth-left">
      <a href="../guest/guestHome.html" class="auth-brand">
        <i class="fa-solid fa-book"></i> EduShare
      </a>
      <div class="auth-illustration">
        <h1>Đặt lại mật khẩu</h1>
        <p>Tạo một mật khẩu mới mạnh mẽ và dễ nhớ để bảo vệ tài khoản của bạn.</p>
      </div>
      <div style="position: relative; z-index: 10; font-size: 14px; color: rgba(255,255,255,0.7);">
        &copy; 2026 EduShare. All rights reserved.
      </div>
    </div>

    
    <div class="auth-right">
      <div class="auth-form-wrapper">
        <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>

        <div id="step-reset" class="step-container active">
          <div class="auth-header">
            <h2>Đặt mật khẩu mới</h2>
            <p>Mật khẩu của bạn phải có ít nhất 6 ký tự</p>
          </div>
          <form id="resetPasswordForm">
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-key" style="color: #4F46E5; margin-right: 6px;"></i> Mật khẩu mới:</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required minlength="6">
                <span class="toggle-password"><i class="fa-solid fa-eye toggle-icon"></i></span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-shield-halved" style="color: #4F46E5; margin-right: 6px;"></i> Xác nhận mật khẩu mới:</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="confirmNewPassword" class="form-control" placeholder="Xác nhận mật khẩu mới" required minlength="6">
                <span class="toggle-password"><i class="fa-solid fa-eye toggle-icon"></i></span>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btnResetPassword" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
              <i class="fa-solid fa-rotate-right"></i> Đổi mật khẩu
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script type="module" src="../../main/auth/reset-password.js"></script>
</body>
</html>
