<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả tìm kiếm - EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/document/searchResults.css">
  <link rel="stylesheet" href="../../css/shared/skeleton.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA0NDggNTEyJz48cGF0aCBmaWxsPScjNGY0NmU1JyBkPSdNOTYgMEM0MyAwIDAgNDMgMCA5NlY0MTZjMCA1MyA0MyA5NiA5NiA5NkgzODRoMzJjMTcuNyAwIDMyLTE0LjMgMzItMzJzLTE0LjMtMzItMzItMzJWMzg0YzE3LjcgMCAzMi0xNC4zIDMyLTMyVjMyYzAtMTcuNy0xNC4zLTMyLTMyLTMySDM4NCA5NnptMCAzODRIMzUydjY0SDk2Yy0xNy43IDAtMzItMTQuMy0zMi0zMnMxNC4zLTMyIDMyLTMyem0zMi0yNDBjMC04LjggNy4yLTE2IDE2LTE2SDMzNmM4LjggMCAxNiA3LjIgMTYgMTZzLTcuMiAxNi0xNiAxNkgxNDRjLTguOCAwLTE2LTcuMi0xNi0xNnptMTYgNDhIMzM2YzguOCAwIDE2IDcuMiAxNiAxNnMtNy4yIDE2LTE2IDE2SDE0NGMtOC44IDAtMTYtNy4yLTE2LTE2czcuMi0xNiAxNi0xNnonLz48L3N2Zz4=">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
  <script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script>
</head>
<body>
  <nav class="navbar">
    <a href="../user/userHome.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare
    </a>

    <div class="nav-search">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" id="searchInput" placeholder="Tìm kiếm tài liệu...">
    </div>

    <div class="nav-actions">
      <div class="icon-btn">
        <a href="uploadDocument.html" style="color:inherit"><i class="fa-solid fa-plus"></i></a>
      </div>
      <button class="nav-notifications" id="navNotifications" type="button" title="Thong bao" aria-label="Thong bao">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="content-area">
      <div class="search-layout">
        <aside class="filter-sidebar">
          <div class="filter-header">
            <h3><i class="fa-solid fa-filter" style="margin-right: 8px;"></i> Bộ lọc</h3>
            <button class="filter-clear" id="btnClearFilter" type="button">Xóa lọc</button>
          </div>

          <div class="active-filters" id="activeFilters" aria-live="polite"></div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-arrow-down-short-wide" style="margin-right: 6px; color: var(--primary);"></i> Sắp xếp theo: </div>
            <select class="filter-select" id="sortSelect">
              <option value="MoiNhat">Mới nhất</option>
              <option value="PhoBien">Lượt tải nhiều nhất</option>
              <option value="Relevance">Liên quan nhất</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px; color: var(--primary);"></i> Cấp bậc: </div>
            <select class="filter-select" id="levelSelect">
              <option value="">Tất cả cấp bậc</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-book-open" style="margin-right: 6px; color: var(--primary);"></i> Môn học: </div>
            <select class="filter-select" id="subjectSelect">
              <option value="">Tất cả môn học</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-star" style="margin-right: 6px; color: var(--primary);"></i> Đánh giá: </div>
            <select class="filter-select" id="ratingSelect">
              <option value="">Tất cả đánh giá</option>
              <option value="5">Từ 5 sao</option>
              <option value="4">Từ 4 sao trở lên</option>
              <option value="3">Từ 3 sao trở lên</option>
              <option value="2">Từ 2 sao trở lên</option>
              <option value="1">Từ 1 sao trở lên</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-file-lines" style="margin-right: 6px; color: var(--primary);"></i> Loại file: </div>
            <div class="file-filter-grid" id="fileTypeFilters">
              <label class="filter-pill">
                <input type="checkbox" name="loaiFile" value="pdf">
                <span><i class="fa-solid fa-file-pdf"></i> PDF</span>
              </label>
              <label class="filter-pill">
                <input type="checkbox" name="loaiFile" value="docx">
                <span><i class="fa-solid fa-file-word"></i> Word</span>
              </label>
              <label class="filter-pill">
                <input type="checkbox" name="loaiFile" value="pptx">
                <span><i class="fa-solid fa-file-powerpoint"></i> PPT</span>
              </label>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-circle-check" style="margin-right: 6px; color: var(--primary);"></i> Trạng thái: </div>
            <label class="filter-toggle">
              <input type="checkbox" id="officialOnly">
              <span class="toggle-track"></span>
              <span>Chỉ tài liệu chính thống</span>
            </label>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-calendar-days" style="margin-right: 6px; color: var(--primary);"></i> Ngày đăng: </div>
            <div class="date-filter-grid">
              <label>
                <span>Từ ngày</span>
                <input type="date" id="fromDate">
              </label>
              <label>
                <span>Đến ngày</span>
                <input type="date" id="toDate">
              </label>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title"><i class="fa-solid fa-user-pen" style="margin-right: 6px; color: var(--primary);"></i> Người đăng: </div>
            <input class="filter-input" type="search" id="authorInput" placeholder="Nhập tên người đăng">
          </div>
        </aside>

        <main class="results-area">
          <div class="results-header" id="resultsHeader" style="display: none;">
            <h1 class="results-count">Tìm thấy <strong>...</strong> kết quả</h1>
          </div>

          <div class="doc-grid" id="resultsGrid"></div>

          <div id="infiniteScrollSentinel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; min-height: 80px; width: 100%;">
            <div id="scrollSpinner" style="display: none; align-items: center; gap: 8px; color: var(--primary); font-weight: 500;">
              <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px;"></i>
              <span>Đang tải thêm tài liệu...</span>
            </div>
            <div id="scrollEndMessage" style="display: none; color: var(--text-secondary, #64748b); font-size: 14px; text-align: center;">
              <i class="fa-solid fa-circle-check" style="margin-right: 6px; color: #10b981;"></i>Đã hiển thị tất cả kết quả
            </div>
          </div>
        </main>
      </div>
    </main>
  </div>

  <script type="module" src="../../main/document/search.js"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
