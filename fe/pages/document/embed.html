<body style="font-family: 'Inter', sans-serif !important;">
    <div class="embed-header">
        <div class="doc-info">
            <h1 class="doc-title" id="embed-title">Đang tải...</h1>
            <div class="doc-author" id="embed-author">EduShare</div>
        </div>
        <a href="documentDetails.html" target="_blank" class="edushare-logo" id="edushare-link">
            <i class="fa-solid fa-book"></i> Xem trên EduShare
        </a>
    </div>

    <div class="embed-content" id="embed-container">
        <div class="loading-state" id="loading-indicator">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Đang tải tài liệu...</span>
        </div>
        
        <div class="error-state" id="error-indicator">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p id="error-message">Không thể tải tài liệu</p>
        </div>
        
        <div class="premium-lock" id="premium-indicator">
            <i class="fa-solid fa-lock"></i>
            <h3>Tài liệu Premium</h3>
            <p>Vui lòng xem trên EduShare để mở khóa tài liệu này.</p>
            <a href="documentDetails.html" target="_blank" class="btn-view-edushare" id="premium-link">Mở trên EduShare</a>
        </div>
        
        <div id="iframe-container" class="iframe-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../main/shared/config.js"></script>
    <script src="../../main/shared/utils.js"></script>
    <script src="../../main/document/embed.js"></script>
</body>
</html>
