<script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script></head>
<body>
  
  <nav class="navbar">
    <a href="../user/userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <!-- <div class="nav-search">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" placeholder="Tìm kiếm tài liệu, môn học, giáo trình...">
    </div> -->
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
                  <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Quản lý tài liệu</h1>
        <a href="uploadDocument.html" class="btn-primary">
          <span><i class="fa-solid fa-plus"></i></span> Đăng tải tài liệu
        </a>
      </div>

      <div class="tabs-container">
        <div class="tab-item active" data-tab="uploaded">
          <i class="fa-solid fa-cloud-arrow-up" style="margin-right: 6px;"></i> Đã đăng tải <span class="tab-count" id="count-uploaded">0</span>
        </div>
        <div class="tab-item" data-tab="bookmarks">
          <i class="fa-solid fa-bookmark" style="margin-right: 6px;"></i> Đã lưu <span class="tab-count" id="count-bookmarks">0</span>
        </div>
        <div class="tab-item" data-tab="downloads">
          <i class="fa-solid fa-cloud-arrow-down" style="margin-right: 6px;"></i> Đã tải xuống <span class="tab-count" id="count-downloads">0</span>
        </div>
      </div>
          
      <div class="filter-bar" style="display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
        <select id="filter-status" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả trạng thái</option>
            <option value="DaDuyet">Đã duyệt</option>
            <option value="ChoDuyet">Chờ duyệt</option>
            <option value="TuChoi">Từ chối</option>
        </select>
        
        <select id="filter-subject" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả môn học</option>
        </select>
        
        <select id="filter-filetype" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả loại file</option>
            <option value="pdf">PDF</option>
            <option value="doc">Word</option>
            <option value="ppt">PowerPoint</option>
        </select>
        
        <div style="position: relative; flex: 2; min-width: 200px; display: flex; align-items: center;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; color: #9CA3AF;"></i>
            <input type="text" id="filter-search" placeholder="Tìm tài liệu theo tên..." style="padding: 8px 12px 8px 36px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; width: 100%;">
        </div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="40%"><i class="fa-solid fa-file-lines" style="margin-right: 6px;"></i> Tên tài liệu</th>
              <th><i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> Môn học</th>
              <th><i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Trạng thái</th>
              <th><i class="fa-solid fa-download" style="margin-right: 6px;"></i> Số lượt tải</th>
              <th><i class="fa-solid fa-calendar-days" style="margin-right: 6px;"></i> Ngày đăng / lưu</th>
              <th><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="my-docs-table-body">
            <tr>
                <td colspan="6" style="text-align:center; padding: 20px;">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <div id="reject-reason-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 1050; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;">
    <div class="modal-content" style="background: var(--white); width: 100%; max-width: 600px; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #FEE2E2; color: #EF4444; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);">
          <i class="fa-solid fa-file-circle-xmark"></i>
        </div>
        <div>
          <h2 style="margin: 0; font-size: 22px; color: #111827; font-weight: 700;">Lý do từ chối</h2>
        </div>
      </div>
      <p style="color: #4B5563; font-size: 15px; margin-bottom: 24px; line-height: 1.6;">Tài liệu <strong id="reject-reason-doc-title" style="color: #111827;"></strong> của bạn đã bị từ chối với lý do sau:</p>

      <div style="background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 16px; margin-bottom: 20px;">
        <p id="reject-reason-content" style="color: #111827; font-size: 14px; margin: 0; font-style: italic; white-space: pre-wrap; word-break: break-word;"></p>
      </div>

      <div class="form-group" style="margin-bottom: 28px;">
        <label class="form-label" style="font-weight: 600; color: #374151; display: flex; align-items: center; margin-bottom: 10px;"><i class="fa-solid fa-comment-dots" style="color: var(--primary); margin-right: 8px; font-size: 16px;"></i> Nhập khiếu nại / phản hồi</label>
        <textarea id="input-reject-appeal" class="form-control" placeholder="Trình bày lý do bạn muốn quản trị viên xem xét lại tài liệu này..." rows="5" style="width: 100%; box-sizing: border-box; resize: vertical; min-height: 120px; font-size: 15px; padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; outline: none;"></textarea>
      </div>

      <div style="display: flex; gap: 12px; width: 100%; justify-content: flex-end;">
        <button type="button" onclick="window.closeRejectReasonModal()" class="btn-secondary" style="padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-weight: 600; color: #4B5563; transition: all 0.2s;"><i class="fa-solid fa-xmark" style="margin-right: 6px;"></i> Đóng</button>
        <button type="button" id="btn-submit-appeal" class="btn-primary" style="padding: 10px 20px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: not-allowed; opacity: 0.5; font-weight: 600; transition: all 0.2s;" disabled><i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Gửi phản hồi</button>
      </div>
    </div>
  </div>

<script type="module" src="../../main/document/myDocuments.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
