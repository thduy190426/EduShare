<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài liệu của tôi — EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/document/myDocuments.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%232563eb' d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
<script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script></head>
<body>
  
  <nav class="navbar">
    <a href="../user/userHome.html" class="logo"><i class="fa-solid fa-book"></i> EduShare</a>
    <!-- <div class="nav-search">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" placeholder="Tìm kiếm tài liệu, môn học, giáo trình...">
    </div> -->
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
                  <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Quản lý tài liệu</h1>
        <a href="uploadDocument.html" class="btn-primary">
          <span><i class="fa-solid fa-plus"></i></span> Đăng tài liệu
        </a>
      </div>

      <div class="tabs-container">
        <div class="tab-item active" data-tab="uploaded">
          <i class="fa-solid fa-cloud-arrow-up" style="margin-right: 6px;"></i> Đã đăng tải <span class="tab-count" id="count-uploaded">0</span>
        </div>
        <div class="tab-item" data-tab="bookmarks">
          <i class="fa-solid fa-bookmark" style="margin-right: 6px;"></i> Đã lưu <span class="tab-count" id="count-bookmarks">0</span>
        </div>
        <div class="tab-item" data-tab="downloads">
          <i class="fa-solid fa-cloud-arrow-down" style="margin-right: 6px;"></i> Đã tải xuống <span class="tab-count" id="count-downloads">0</span>
        </div>
      </div>

      <div class="filter-bar" style="display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
        <select id="filter-status" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả trạng thái</option>
            <option value="DaDuyet">Đã duyệt</option>
            <option value="ChoDuyet">Chờ duyệt</option>
            <option value="TuChoi">Từ chối</option>
        </select>
        
        <select id="filter-subject" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả môn học</option>
        </select>
        
        <select id="filter-filetype" style="padding: 8px 12px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; flex: 1; min-width: 150px;">
            <option value="all">Tất cả loại file</option>
            <option value="pdf">PDF</option>
            <option value="doc">Word</option>
            <option value="ppt">PowerPoint</option>
        </select>
        
        <div style="position: relative; flex: 2; min-width: 200px; display: flex; align-items: center;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; color: #9CA3AF;"></i>
            <input type="text" id="filter-search" placeholder="Tìm tài liệu theo tên..." style="padding: 8px 12px 8px 36px; border: 1px solid #E5E7EB; border-radius: 6px; outline: none; width: 100%;">
        </div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="40%"><i class="fa-solid fa-file-lines" style="margin-right: 6px;"></i> Tên tài liệu</th>
              <th><i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> Môn học</th>
              <th><i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Trạng thái</th>
              <th><i class="fa-solid fa-download" style="margin-right: 6px;"></i> Số lượt tải</th>
              <th><i class="fa-solid fa-calendar-days" style="margin-right: 6px;"></i> Ngày đăng / lưu</th>
              <th><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="my-docs-table-body">
            <tr>
                <td colspan="6" style="text-align:center; padding: 20px;">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

<script type="module" src="../../main/document/myDocuments.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
