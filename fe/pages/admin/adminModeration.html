<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm duyệt tài liệu — EduShare Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/admin/adminModeration.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA0NDggNTEyJz48cGF0aCBmaWxsPScjNGY0NmU1JyBkPSdNOTYgMEM0MyAwIDAgNDMgMCA5NlY0MTZjMCA1MyA0MyA5NiA5NiA5NkgzODRoMzJjMTcuNyAwIDMyLTE0LjMgMzItMzJzLTE0LjMtMzItMzItMzJWMzg0YzE3LjcgMCAzMi0xNC4zIDMyLTMyVjMyYzAtMTcuNy0xNC4zLTMyLTMyLTMySDM4NCA5NnptMCAzODRIMzUydjY0SDk2Yy0xNy43IDAtMzItMTQuMy0zMi0zMnMxNC4zLTMyIDMyLTMyem0zMi0yNDBjMC04LjggNy4yLTE2IDE2LTE2SDMzNmM4LjggMCAxNiA3LjIgMTYgMTZzLTcuMiAxNi0xNiAxNkgxNDRjLTguOCAwLTE2LTcuMi0xNi0xNnptMTYgNDhIMzM2YzguOCAwIDE2IDcuMiAxNiAxNnMtNy4yIDE2LTE2IDE2SDE0NGMtOC44IDAtMTYtNy4yLTE2LTE2czcuMi0xNiAxNi0xNnonLz48L3N2Zz4=">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
<script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script></head>
<body>

  <nav class="navbar">
    <a href="../user/userHome.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare
      <span class="logo-badge">Admin</span>
    </a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
            <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Kiểm duyệt tài liệu</h1>
      </div>

      <div class="tabs-container">
        <div class="tab-item active" data-status="ChoDuyet">
          <i class="fa-solid fa-hourglass-half" style="margin-right: 6px;"></i> Chờ duyệt <span class="tab-count" id="pending-count-tab">0</span>
        </div>
        <div class="tab-item" data-status="DaDuyet"><i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Đã duyệt <span class="tab-count" id="approved-count-tab">0</span></div>
        <div class="tab-item" data-status="TuChoi"><i class="fa-solid fa-circle-xmark" style="margin-right: 6px;"></i> Từ chối <span class="tab-count" id="rejected-count-tab">0</span></div>
      </div>

      <div id="bulk-actions-toolbar" class="bulk-actions-toolbar" style="display: none; align-items: center; justify-content: space-between; background: var(--surface-color); padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid var(--border-color);">
        <span class="bulk-count" style="font-weight: 500; color: var(--text-primary);"><span id="bulk-selected-count">0</span> tài liệu được chọn</span>
        <div class="bulk-actions" style="display: flex; gap: 12px;">
          <button class="btn-modal btn-confirm-reject" id="btn-bulk-approve" style="background: #10b981; margin: 0;"><i class="fa-solid fa-check-double" style="margin-right: 6px;"></i> Duyệt tất cả</button>
          <button class="btn-modal btn-cancel" id="btn-bulk-reject" style="background: #ef4444; color: white; border: none; margin: 0;"><i class="fa-solid fa-ban" style="margin-right: 6px;"></i> Từ chối tất cả</button>
        </div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="4%" style="text-align: center;"></th>
              <th width="5%" style="text-align: center;">STT</th>
              <th width="31%" class="sortable" data-sort="TenTL" style="cursor: pointer;"><i class="fa-solid fa-file-lines" style="margin-right: 6px;"></i> Tên tài liệu <i class="fa-solid fa-sort" style="margin-left: 4px; color: #9ca3af; font-size: 12px;"></i></th>
              <th class="sortable" data-sort="TenNguoiDang" style="cursor: pointer;"><i class="fa-solid fa-user-pen" style="margin-right: 6px;"></i> Người đăng <i class="fa-solid fa-sort" style="margin-left: 4px; color: #9ca3af; font-size: 12px;"></i></th>
              <th class="sortable" data-sort="TenMonHoc" style="cursor: pointer;"><i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> Môn học <i class="fa-solid fa-sort" style="margin-left: 4px; color: #9ca3af; font-size: 12px;"></i></th>
              <th class="sortable" data-sort="NgayDang" style="cursor: pointer;"><i class="fa-solid fa-calendar-plus" style="margin-right: 6px;"></i> Ngày đăng <i class="fa-solid fa-sort" style="margin-left: 4px; color: #9ca3af; font-size: 12px;"></i></th>
              <th class="sortable" data-sort="TrangThaiKiemDuyet" style="cursor: pointer;"><i class="fa-solid fa-shield-halved" style="margin-right: 6px;"></i> Trạng thái <i class="fa-solid fa-sort" style="margin-left: 4px; color: #9ca3af; font-size: 12px;"></i></th>
              <th><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="pending-documents-tbody">
            
          </tbody>
        </table>
      </div>

      <div class="pagination-container" id="moderation-pagination">
        
      </div>
      
    </main>
  </div>

  
  <div class="modal-overlay" id="reject-modal-overlay" style="display: none;">
    <div class="modal-container">
      <div class="modal-close" id="btn-close-modal">×</div>
      <h3 class="modal-title">Từ chối tài liệu</h3>
      <p class="modal-desc">Vui lòng cung cấp lý do từ chối tài liệu <strong id="reject-doc-title"></strong> để thông báo cho người đăng.</p>
      
      <div class="form-group">
        <label class="form-label">Lý do từ chối <span style="color:var(--danger)">*</span></label>
        <textarea id="reject-reason-input" class="form-control" placeholder="Ví dụ: Tài liệu mờ, nội dung vi phạm bản quyền, sai môn học..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" id="btn-cancel-modal"><i class="fa-solid fa-xmark" style="margin-right: 6px;"></i> Hủy</button>
        <button class="btn-modal btn-confirm-reject" id="btn-confirm-reject"><i class="fa-solid fa-check" style="margin-right: 6px;"></i> Xác nhận</button>
      </div>
    </div>
  </div>

  <script type="module" src="../../main/admin/adminModeration.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
