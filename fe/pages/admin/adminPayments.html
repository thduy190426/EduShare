<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý nạp xu — EduShare Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/admin/adminModeration.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath fill='%232563eb' d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
<script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script></head>
<body>

  <nav class="navbar">
    <a href="../user/userHome.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare
      <span class="logo-badge">Admin</span>
    </a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
            <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Quản lý Nạp EduCoin</h1>
      </div>

      <div class="tabs-container">
        <div class="tab-item active" data-status="ChoDuyet">
          <i class="fa-solid fa-hourglass-half" style="margin-right: 6px;"></i> Chờ duyệt <span class="tab-count" id="pending-count-tab">0</span>
        </div>
        <div class="tab-item" data-status="DaDuyet"><i class="fa-solid fa-circle-check" style="margin-right: 6px;"></i> Đã duyệt <span class="tab-count" id="approved-count-tab">0</span></div>
        <div class="tab-item" data-status="TuChoi"><i class="fa-solid fa-circle-xmark" style="margin-right: 6px;"></i> Từ chối <span class="tab-count" id="rejected-count-tab">0</span></div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="30%"><i class="fa-solid fa-user" style="margin-right: 6px;"></i> Người nạp</th>
              <th width="25%"><i class="fa-solid fa-money-bill" style="margin-right: 6px;"></i> Số tiền / Xu</th>
              <th width="20%"><i class="fa-solid fa-calendar" style="margin-right: 6px;"></i> Ngày tạo</th>
              <th width="15%"><i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i> Trạng thái</th>
              <th width="10%" style="text-align: right;"><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Thao tác</th>
            </tr>
          </thead>
          <tbody id="table-body">

          </tbody>
        </table>
      </div>

      <div class="pagination" id="moderation-pagination">
        
      </div>
      
    </main>
  </div>

  
  <div class="modal-overlay" id="reject-modal-overlay" style="display: none;">
    <div class="modal-container">
      <div class="modal-close" id="btn-close-modal">×</div>
      <h3 class="modal-title">Từ chối tài liệu</h3>
      <p class="modal-desc">Vui lòng cung cấp lý do từ chối tài liệu <strong id="reject-doc-title"></strong> để thông báo cho người đăng.</p>
      
      <div class="form-group">
        <label class="form-label">Lý do từ chối <span style="color:var(--danger)">*</span></label>
        <textarea id="reject-reason-input" class="form-control" placeholder="Ví dụ: Tài liệu mờ, nội dung vi phạm bản quyền, sai môn học..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" id="btn-cancel-modal"><i class="fa-solid fa-xmark"></i> Hủy bỏ</button>
        <button class="btn-modal btn-confirm-reject" id="btn-confirm-reject"><i class="fa-solid fa-check"></i> Xác nhận</button>
      </div>
    </div>
  </div>

  <script type="module" src="../../main/admin/adminPayments.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
