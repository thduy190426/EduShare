<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng — EduShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/admin/adminUserManagement.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA0NDggNTEyJz48cGF0aCBmaWxsPScjNGY0NmU1JyBkPSdNOTYgMEM0MyAwIDAgNDMgMCA5NlY0MTZjMCA1MyA0MyA5NiA5NiA5NkgzODRoMzJjMTcuNyAwIDMyLTE0LjMgMzItMzJzLTE0LjMtMzItMzItMzJWMzg0YzE3LjcgMCAzMi0xNC4zIDMyLTMyVjMyYzAtMTcuNy0xNC4zLTMyLTMyLTMySDM4NCA5NnptMCAzODRIMzUydjY0SDk2Yy0xNy43IDAtMzItMTQuMy0zMi0zMnMxNC4zLTMyIDMyLTMyem0zMi0yNDBjMC04LjggNy4yLTE2IDE2LTE2SDMzNmM4LjggMCAxNiA3LjIgMTYgMTZzLTcuMiAxNi0xNiAxNkgxNDRjLTguOCAwLTE2LTcuMi0xNi0xNnptMTYgNDhIMzM2YzguOCAwIDE2IDcuMiAxNiAxNnMtNy4yIDE2LTE2IDE2SDE0NGMtOC44IDAtMTYtNy4yLTE2LTE2czcuMi0xNiAxNi0xNnonLz48L3N2Zz4=">
  <link rel="stylesheet" href="../../css/shared/sidebar.css">
  <script>if(localStorage.getItem('sidebar-collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}</script>
</head>
<body>
  
  <nav class="navbar">
    <a href="adminDashboard.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare <span class="logo-badge">Admin</span>
    </a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Quản lý người dùng</h1>
      </div>

      
      <div class="filter-bar">
        <div class="search-wrapper">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" id="input-search" placeholder="Tìm kiếm theo tên hoặc email...">
        </div>
        <select class="filter-select" id="filter-role" aria-label="Loc theo vai tro">
          <option value="">Tất cả vai trò</option>
          <option value="SinhVien">Sinh viên</option>
          <option value="GiaoVien">Giáo viên</option>
        </select>
        <select class="filter-select" id="filter-status" aria-label="Lọc theo trạng thái">
          <option value="">Tất cả trạng thái</option>
          <option value="HoatDong">Hoạt động</option>
          <option value="BiKhoa">Bị khóa</option>
        </select>
        <select class="filter-select" id="filter-sort" aria-label="Sắp xếp người dùng">
          <option value="newest">Mới nhất</option>
          <option value="oldest">Cũ nhất</option>
          <option value="name_asc">Tên A-Z</option>
          <option value="name_desc">Tên Z-A</option>
        </select>
        <button class="btn-clear-filter" id="btn-clear-filter" type="button">
          <i class="fa-solid fa-rotate-left"></i> Xóa bộ lọc
        </button>
      </div>

      <div class="bulk-actions" id="bulk-actions-container" style="display: none; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color);">
        <span style="font-weight: 500; color: var(--text-color);">Đã chọn <strong id="selected-count" style="color: var(--primary-color);">0</strong> người dùng</span>
        <div style="flex-grow: 1;"></div>
        <button class="btn-bulk btn-bulk-unlock" id="btn-bulk-unlock" type="button" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
          <i class="fa-solid fa-unlock" style="margin-right: 5px;"></i> Mở khóa đã chọn
        </button>
        <button class="btn-bulk btn-bulk-lock" id="btn-bulk-lock" type="button" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
          <i class="fa-solid fa-lock" style="margin-right: 5px;"></i> Khóa đã chọn
        </button>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="5%"></th>
              <th width="5%" style="text-align: center;">STT</th>
              <th width="30%"><i class="fa-solid fa-user" style="margin-right: 6px;"></i> Người dùng</th>
              <th><i class="fa-solid fa-id-badge" style="margin-right: 6px;"></i> Vai trò</th>
              <th><i class="fa-solid fa-envelope" style="margin-right: 6px;"></i> Email</th>
              <th><i class="fa-solid fa-calendar-days" style="margin-right: 6px;"></i> Ngày tham gia</th>
              <th><i class="fa-solid fa-toggle-on" style="margin-right: 6px;"></i> Trạng thái</th>
              <th><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            
          </tbody>
        </table>
      </div>
      <div class="pagination-container" id="user-pagination"></div>

    </main>
  </div>

  <div id="badge-modal" class="modal">
    <div class="modal-content">
      <span class="close" id="close-badge-modal">&times;</span>
      <h2>Trao Danh Hiệu</h2>
      <p style="margin-bottom: 20px; font-size: 15px;">Đang thao tác với người dùng: <strong id="badge-user-name" style="color: var(--primary);"></strong></p>
      
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="badge-select" style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-primary);">Chọn danh hiệu:</label>
        <div style="position: relative;">
          <select id="badge-select" class="form-control" style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; transition: border-color 0.2s; font-size: 15px; appearance: none; background-color: #f8fafc; cursor: pointer;">
          </select>
          <i class="fa-solid fa-chevron-down" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #64748b; pointer-events: none;"></i>
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 24px; padding: 12px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="const cb = document.getElementById('badge-is-primary'); if(event.target !== cb) cb.click();">
        <input type="checkbox" id="badge-is-primary" checked style="width: 18px; height: 18px; cursor: pointer;">
        <label for="badge-is-primary" style="margin: 0; cursor: pointer; font-weight: 500; color: #166534;">Đặt làm danh hiệu chính</label>
      </div>
      
      <button id="btn-submit-badge" style="width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);">
        Lưu thay đổi
      </button>
    </div>
  </div>

  <script type="module" src="../../main/admin/adminUserManagement.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
