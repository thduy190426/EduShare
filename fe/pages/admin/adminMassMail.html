<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Email Hàng Loạt - EduShare Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared/base.css">
    <link rel="stylesheet" href="../../css/shared/sidebar.css">
    <link rel="stylesheet" href="../../css/admin/adminDashboard.css">
    <link rel="stylesheet" href="../../css/admin/adminMassMail.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    
    <nav class="navbar">
        <a href="adminDashboard.html" class="logo">
            <i class="fa-solid fa-book"></i> EduShare <span class="logo-badge">Admin</span>
        </a>
        <div class="nav-actions">
            <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
                <i class="fa-solid fa-bell"></i>
                <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
            </button>
            <div class="user-profile" id="userProfileNav">
                <div class="avatar" id="navAvatar">?</div>
                <div class="user-info">
                    <span class="user-name" id="navUserName">Đang tải...</span>
                    <span class="user-role" id="navUserRole"></span>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <aside id="app-sidebar" class="sidebar"></aside>
        
        <main class="content-area">
        <div class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-paper-plane"></i> Gửi Email Hàng Loạt</h1>
        </div>

        <div class="mass-mail-card">
            <form id="massMailForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="mailTarget"><i class="fa-solid fa-users" style="margin-right: 5px; color: var(--text-secondary);"></i> Gửi đến (Đối tượng)</label>
                        <select id="mailTarget" class="form-control" required>
                            <option value="all">Tất cả người dùng (Hoạt động)</option>
                            <option value="students">Chỉ Sinh viên</option>
                            <option value="teachers">Chỉ Giáo viên</option>
                            <option value="admins">Chỉ Admin</option>
                            <option value="locked">Tài khoản bị khóa</option>
                            <option value="specific">Một người dùng cụ thể</option>
                        </select>
                    </div>
                </div>

                <div class="form-row" id="specificUserRow" style="display: none; margin-bottom: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="specificEmail"><i class="fa-solid fa-envelope" style="margin-right: 5px; color: var(--text-secondary);"></i> Email người dùng</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="specificEmail" class="form-control" placeholder="Nhập email người dùng...">
                            <button type="button" id="btnCheckEmail" class="btn-send" style="padding: 0 20px; white-space: nowrap; width: auto; background-color: var(--secondary);" disabled>Kiểm tra</button>
                        </div>
                    </div>
                </div>

                <div id="specificUserInfo" style="display: none; margin-bottom: 20px; align-items: center; gap: 15px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc;">
                    <img id="specificUserAvatar" src="" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary);">
                    <div>
                        <div id="specificUserName" style="font-weight: 600; font-size: 16px; color: var(--text-primary);"></div>
                        <div id="specificUserRole" style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mailSubject"><i class="fa-solid fa-heading" style="margin-right: 5px; color: var(--text-secondary);"></i> Tiêu đề Email</label>
                    <input type="text" id="mailSubject" class="form-control" placeholder="Nhập tiêu đề thư (Ví dụ: Thông báo cập nhật hệ thống...)" required>
                </div>

                <div class="form-group editor-group">
                    <label><i class="fa-solid fa-align-left" style="margin-right: 5px; color: var(--text-secondary);"></i> Nội dung Email</label>
                    <div id="editor-container"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-send" id="btnSendMail">
                        <i class="fa-solid fa-paper-plane"></i> Gửi Email
                    </button>
                </div>
            </form>
        </div>
    </main>
    </div> 

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="../../main/shared/sidebar.js"></script>
    <script type="module" src="../../main/admin/adminMassMail.js"></script>
</body>
</html>
