<body>
  
  <nav class="navbar">
    <a href="adminDashboard.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare <span class="logo-badge">Admin</span>
    </a>
    <div class="nav-actions">
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">A</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Admin</span>
          <span class="user-role" id="navUserRole">Quản trị viên</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="content-area">
      <div class="page-header">
        <h1 class="page-title"><i class="fa-solid fa-database"></i> Sao lưu Dữ liệu</h1>
        <button id="btnCreateBackup" class="btn-primary">
            <i class="fa-solid fa-download"></i> Tạo bản sao lưu
        </button>
      </div>

      <div class="settings-card auto-backup-card">
        <h3 class="section-title"><i class="fa-solid fa-clock"></i> Cài đặt tự động sao lưu</h3>
        <form id="autoBackupForm">
          <div class="form-row">
            <div class="form-group">
              <label for="AUTO_BACKUP_ENABLED">Trạng thái tự động sao lưu</label>
              <select id="AUTO_BACKUP_ENABLED" name="AUTO_BACKUP_ENABLED" class="form-control">
                <option value="1">Bật (Tự động sao lưu)</option>
                <option value="0">Tắt</option>
              </select>
            </div>
            <div class="form-group">
              <label for="AUTO_BACKUP_SCHEDULE">Chu kỳ sao lưu</label>
              <select id="AUTO_BACKUP_SCHEDULE" name="AUTO_BACKUP_SCHEDULE" class="form-control">
                <option value="daily">Hàng ngày</option>
                <option value="weekly">Hàng tuần</option>
                <option value="monthly">Hàng tháng</option>
              </select>
            </div>
            <div class="form-group">
              <label for="MAX_BACKUPS_RETAIN">Giữ lại tối đa (File)</label>
              <input type="number" id="MAX_BACKUPS_RETAIN" name="MAX_BACKUPS_RETAIN" min="1" max="30" class="form-control" value="5">
            </div>
          </div>
          <button type="submit" class="btn-save" id="btnSaveConfig"><i class="fa-solid fa-save"></i> Lưu cài đặt</button>
        </form>
      </div>

      <div class="backups-list-container">
        <h3 class="section-title"><i class="fa-solid fa-list"></i> Danh sách bản sao lưu</h3>
        <div class="table-responsive">
          <table class="data-table" id="backupsTable">
            <thead>
              <tr>
                <th>Tên file</th>
                <th>Kích thước</th>
                <th>Ngày tạo</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="backupsTableBody">
              <tr>
                <td colspan="4" class="text-center py-4">Đang tải dữ liệu...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../../main/shared/sidebar.js"></script>
  <script type="module" src="../../main/admin/adminBackups.js"></script>
</body>
</html>
