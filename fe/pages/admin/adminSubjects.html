<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý môn học — EduShare Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/admin/adminUserManagement.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
  
  
  <nav class="navbar">
    <a href="adminDashboard.html" class="logo">
      <i class="fa-solid fa-book"></i> EduShare <span class="logo-badge">Admin</span>
    </a>
    <div class="nav-actions">
      <button class="nav-notifications" id="navNotifications" type="button" title="Thông báo" aria-label="Thông báo">
        <i class="fa-solid fa-bell"></i>
        <span class="nav-notification-badge" id="navNotificationBadge" style="display:none;">0</span>
      </button>
      <div class="user-profile" id="userProfileNav">
        <div class="avatar" id="navAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="navUserName">Đang tải...</span>
          <span class="user-role" id="navUserRole"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-layout">
    
    <aside id="app-sidebar" class="sidebar"></aside>

    
    <main class="content-area">
      
      <div class="page-header">
        <h1 class="page-title">Quản lý Môn học</h1>
      </div>

      
      <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-container {
            background: white;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            animation: modalFadeIn 0.3s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-overlay.closing {
            animation: overlayFadeOut 0.2s ease-in forwards;
        }
        .modal-container.closing {
            animation: modalFadeOut 0.2s ease-in forwards;
        }
        @keyframes overlayFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes modalFadeOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 24px;
            color: #9CA3AF;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #4B5563;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-modal {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-cancel {
            background: #F3F4F6;
            color: #374151;
        }
        .btn-cancel:hover {
            background: #E5E7EB;
        }
        .btn-confirm {
            background: #4F46E5;
            color: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .btn-confirm:hover:not(:disabled) {
            background: #4338CA;
            transform: translateY(-1px);
        }
        .btn-confirm:disabled {
            background: #9CA3AF !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }
        
        .btn-add-subject {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2), 0 2px 4px -1px rgba(79, 70, 229, 0.1);
            transition: all 0.2s ease;
        }
        .btn-add-subject:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3), 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-add-subject:active {
            transform: translateY(0);
        }
      </style>
      
      <div style="margin-bottom: 20px;">
        <button class="btn-add-subject" onclick="openAddSubjectModal()">
          <i class="fa-solid fa-circle-plus" style="font-size: 16px;"></i> Thêm môn học
        </button>
      </div>

      <div class="table-card" style="margin-bottom: 24px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border);">
          <h3 style="margin: 0; font-size: 18px; color: var(--text-primary);">
            <i class="fa-solid fa-lightbulb" style="margin-right: 8px; color: var(--primary);"></i> Đề xuất môn học chờ duyệt
          </h3>
          <button id="btn-refresh-suggestions" class="btn-add-subject" style="padding: 9px 14px; font-size: 13px;" onclick="fetchSubjectSuggestions()">
            <i class="fa-solid fa-rotate"></i> Làm mới
          </button>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th width="5%" style="text-align: center;">STT</th>
              <th width="15%"><i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> Tên môn học</th>
              <th width="10%"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px;"></i> Cấp học</th>
              <th width="20%"><i class="fa-solid fa-user" style="margin-right: 6px;"></i> Người đề xuất</th>
              <th width="25%"><i class="fa-solid fa-comment-dots" style="margin-right: 6px;"></i> Lý do</th>
              <th width="15%"><i class="fa-regular fa-clock" style="margin-right: 6px;"></i> Ngày đề xuất</th>
              <th><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="subject-suggestion-table-body">
          </tbody>
        </table>
      </div>


      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th width="5%" style="text-align: center;">STT</th>
              <th width="18%"><i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> Tên môn học</th>
              <th width="12%"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px;"></i> Cấp học</th>
              <th width="20%"><i class="fa-solid fa-align-left" style="margin-right: 6px;"></i> Mô tả</th>
              <th width="15%"><i class="fa-solid fa-file-lines" style="margin-right: 6px;"></i> Số tài liệu</th>
              <th width="20%"><i class="fa-regular fa-clock" style="margin-right: 6px;"></i> Ngày cập nhật</th>
              <th style="white-space: nowrap;"><i class="fa-solid fa-gears" style="margin-right: 6px;"></i> Hành động</th>
            </tr>
          </thead>
          <tbody id="subject-table-body">
            
          </tbody>
        </table>
      </div>
      <div class="pagination-container" id="subject-pagination"></div>

    </main>
  </div>

  <div class="modal-overlay" id="addSubjectModal" style="display: none;">
    <div class="modal-container">
      <div class="modal-close" onclick="closeAddSubjectModal()">×</div>
      <h3 class="modal-title">Thêm môn học mới</h3>
      
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-book-open" style="margin-right: 6px; color: var(--primary);"></i>Tên môn học: <span style="color:var(--danger)">*</span></label>
        <input type="text" id="input-subject-name" class="form-control" placeholder="Nhập tên môn học...">
      </div>
      
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px; color: var(--primary);"></i>Cấp học: </label>
        <input type="text" id="input-subject-level" class="form-control" placeholder="Ví dụ: Đại học, THPT...">
      </div>

      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-align-left" style="margin-right: 6px; color: var(--primary);"></i>Mô tả chi tiết: </label>
        <textarea id="input-subject-desc" class="form-control" placeholder="Nhập mô tả về môn học..." rows="3"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeAddSubjectModal()"><i class="fa-solid fa-xmark" style="margin-right: 6px;"></i>Hủy</button>
        <button class="btn-modal btn-confirm" id="btn-add-subject-confirm" style="background: var(--primary); color: white;" onclick="addSubject()" disabled><i class="fa-solid fa-check" style="margin-right: 6px;"></i>Thêm</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editSubjectModal" style="display: none;">
    <div class="modal-container">
      <div class="modal-close" onclick="closeEditSubjectModal()">×</div>
      <h3 class="modal-title">Chỉnh sửa môn học</h3>
      
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-book-open" style="margin-right: 6px; color: var(--primary);"></i>Tên môn học: <span style="color:var(--danger)">*</span></label>
        <input type="text" id="edit-subject-name" class="form-control" placeholder="Nhập tên môn học...">
      </div>
      
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px; color: var(--primary);"></i>Cấp học:</label>
        <input type="text" id="edit-subject-level" class="form-control" placeholder="Ví dụ: Đại học, THPT...">
      </div>

      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-align-left" style="margin-right: 6px; color: var(--primary);"></i>Mô tả chi tiết: </label>
        <textarea id="edit-subject-desc" class="form-control" placeholder="Nhập mô tả về môn học..." rows="3"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeEditSubjectModal()"><i class="fa-solid fa-xmark" style="margin-right: 6px;"></i>Hủy</button>
        <button class="btn-modal btn-confirm" id="btn-edit-subject-confirm" style="background: var(--primary); color: white;" onclick="submitEditSubject()" disabled><i class="fa-solid fa-check" style="margin-right: 6px;"></i>Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <script type="module" src="../../main/admin/adminSubjects.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../main/shared/sidebar.js"></script>
</body>
</html>
